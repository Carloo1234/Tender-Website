info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/auth/sign-up/email
  body:
    type: json
    data: |-
      {
        "email": "test@mail.com",
        "password": "password123",
        "name": "Test User"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
